<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Web Bakery</title>
    <link rel="stylesheet" href="style/style.css">
    <script src="script/script.js" defer></script>
</head>
<body>

    <h1>Welcome <span id="title">to the</span> DIGITAL OVEN!</h1>

    <div class="wrapper">
        <div class="set-info">
            <h2>Set Minutes</h2>
            <div class="box">
                <ul>
                    <li>8 minutes</li>
                    <li>9 minutes</li>
                    <li>10 minutes</li>
                    <li>11 minutes</li>
                    <li>12 minutes</li>
                </ul>
            </div>
        </div>

        <div class="set-info">
            <h2>Set Temperature</h2>
            <div class="box">
                <ul>
                    <li>325°</li>
                    <li>350°</li>
                    <li>375°</li>
                    <li>400</li>
                    <li>425°</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="button">
        <p>Bake!</p>
    </div>

</body>
</html>
